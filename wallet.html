<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEGA DATA PLUG - Wallet</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

.header{
background:#d60000;
color:white;
padding:20px;
text-align:center;
}

.card{
background:white;
margin:20px;
padding:20px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.balance{
font-size:30px;
font-weight:bold;
color:#d60000;
margin:10px 0;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
}

button{
width:100%;
padding:14px;
background:#d60000;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#b00000;
}

.back{
display:block;
margin:20px;
text-align:center;
text-decoration:none;
background:#333;
color:white;
padding:14px;
border-radius:8px;
}
</style>
</head>

<body>

<div class="header">
<h2>Wallet</h2>
</div>

<div class="card">

<p>Wallet Balance</p>

<div class="balance" id="balance">₦0.00</div>

<input
type="number"
id="amount"
placeholder="Enter Amount">

<button onclick="fundWallet()">
Fund Wallet (Demo)
</button>

</div>

<a class="back" href="dashboard.html">
⬅ Back to Dashboard
</a>

<script>
let balance =
Number(localStorage.getItem("walletBalance")) || 0;

function showBalance(){
document.getElementById("balance").innerHTML =
"₦" + balance.toLocaleString();
}

showBalance();

function fundWallet(){

let amount =
Number(document.getElementById("amount").value);

if(amount<=0){

alert("Enter a valid amount");

return;

}

balance += amount;

localStorage.setItem(
"walletBalance",
balance
);

showBalance();

document.getElementById("amount").value="";

alert("Wallet funded successfully (Demo).");

}
</script>

</body>
</html>
