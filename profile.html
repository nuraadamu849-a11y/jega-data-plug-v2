<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEGA DATA PLUG - Profile</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

.header{
background:#d60000;
color:white;
padding:20px;
text-align:center;
}

.card{
background:white;
margin:20px;
padding:20px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.info{
margin:15px 0;
font-size:18px;
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:#d60000;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

.back{
display:block;
margin:20px;
padding:15px;
text-align:center;
background:#333;
color:white;
text-decoration:none;
border-radius:8px;
}
</style>
</head>

<body>

<div class="header">
<h2>My Profile</h2>
</div>

<div class="card">

<div class="info"><strong>Full Name:</strong> <span id="fullname"></span></div>

<div class="info"><strong>Email:</strong> <span id="email"></span></div>

<div class="info"><strong>Phone:</strong> <span id="phone"></span></div>

<div class="info"><strong>Wallet Balance:</strong> ₦<span id="balance"></span></div>

<button onclick="logout()">Logout</button>

</div>

<a href="dashboard.html" class="back">⬅ Back to Dashboard</a>

<script>
let user = JSON.parse(localStorage.getItem("user")) || {};
let balance = Number(localStorage.getItem("walletBalance")) || 0;

document.getElementById("fullname").textContent = user.fullname || "";
document.getElementById("email").textContent = user.email || "";
document.getElementById("phone").textContent = user.phone || "";
document.getElementById("balance").textContent = balance.toLocaleString();

function logout(){
if(confirm("Are you sure you want to logout?")){
window.location = "login.html";
}
}
</script>

</body>
</html>
``
